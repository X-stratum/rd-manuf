# ==============================================================================
# 📣 CATALOGUE D'ALERTES — qui doit AGIR, qui doit être INFORMÉ, pour chaque code d'erreur
# ==============================================================================
# 🎯 Rôle
#   Associe chaque code d'erreur (CodeErreur, voir src/rd_manuf/contrat.py) à des RÔLES, jamais à des personnes.
#   Les noms et adresses des personnes ne sont PAS dans ce dépôt (public) : ils vivront dans un annuaire hors Git.
#
# 👥 Ajouter un interlocuteur
#   1. déclarer le rôle dans `roles` ;
#   2. l'ajouter dans `toujours_informes` (informé de tout) ou dans `informe` d'un code précis.
#   Aucune ligne de code à modifier.
#
# 🔑 Vocabulaire
#   agit    : le rôle qui doit résoudre le problème (un seul par code)
#   informe : rôles tenus au courant, en plus de `toujours_informes`
#   Celui qui agit n'apparaît jamais aussi dans les informés.
# ==============================================================================

roles: [emetteur, metier, equipe_data]

# Informés de TOUTE alerte, même quand le problème vient de l'émetteur.
toujours_informes: [metier]

codes:
  OBLIGATOIRE_MANQUANT:
    agit: emetteur            # la donnée n'a pas été envoyée : seul l'émetteur peut la fournir
  TYPE_INVALIDE:
    agit: emetteur            # format d'export cassé côté émetteur
  HORS_PLAGE:
    agit: emetteur            # valeur physiquement impossible : erreur de saisie ou de capteur
  MOTIF_NON_RESPECTE:
    agit: emetteur            # identifiant mal formé
  VALEUR_HORS_DOMAINE:
    agit: metier              # seul le métier sait si une nouvelle valeur (ex. une 4e ligne de fabrication) est légitime
  REGLE_ENTRE_COLONNES:
    agit: emetteur            # incohérence entre deux colonnes de la même ligne
  CLE_EN_CONFLIT:
    agit: emetteur            # lui seul sait laquelle des deux lignes est la bonne
  LIGNE_MALFORMEE:
    agit: emetteur            # ligne coupée ou mal protégée : seul l'émetteur peut la renvoyer entière
    informe: [equipe_data]    # une ligne coupée peut aussi venir d'un transfert interrompu de notre côté

# Refus d'une livraison pour sa STRUCTURE (en-tête, voir CodeStructure dans src/rd_manuf/structure.py) : aucune ligne n'est lue.
# Sans ces règles, un mauvais en-tête serait refusé EN SILENCE.
structure:
  FICHIER_VIDE:
    agit: emetteur            # fichier sans ligne de données (ou sans en-tête) : seul l'émetteur peut le renvoyer
    informe: [equipe_data]
  FICHIER_ILLISIBLE:
    agit: emetteur            # fichier abîmé, mal encodé ou d'un format inconnu : seul l'émetteur peut le renvoyer lisible
    informe: [equipe_data]    # un fichier abîmé peut venir d'un transfert interrompu de notre côté
  NOM_FICHIER_INVALIDE:
    agit: emetteur            # le nom ne suit pas la convention (pays, usine, date en UTC) : seul l'émetteur peut renvoyer le fichier
    informe: [equipe_data]    # la convention est peut-être à faire évoluer, ou mal communiquée à cette usine
  LIVRAISON_EN_CONFLIT:
    agit: emetteur            # même origine et même instant qu'une livraison déjà intégrée, contenu différent : lui seul sait laquelle est juste
    informe: [equipe_data]    # peut aussi venir d'un horodatage mal généré côté usine
  COLONNE_MANQUANTE:
    agit: emetteur            # colonne du contrat absente de l'en-tête
    informe: [equipe_data]    # un refus peut venir d'une nouvelle version du fichier : le contrat devra peut-être évoluer
  COLONNE_INCONNUE:
    agit: emetteur            # colonne qui n'existe pas dans le contrat
    informe: [equipe_data]
  COLONNE_DUPLIQUEE:
    agit: emetteur            # même nom de colonne présent plusieurs fois : lecture ambiguë
    informe: [equipe_data]

# Alerte supplémentaire quand le taux de rejet dépasse le seuil du contrat : rien n'entre en silver.
livraison_bloquee:
  agit: metier                # qualifie l'écart : incident ponctuel ou dérive durable ?
  informe: [emetteur, equipe_data]
