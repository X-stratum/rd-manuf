[project]
name = "rd-manuf"
version = "0.1.0"
description = "Pipeline médaillon R&D Manufacturing sur Databricks"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]          # lecture des contrats YAML

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]                  # `import rd_manuf` fonctionne sans installer le paquet
testpaths = ["tests/unitaires"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
