[project]
name = "rd-manuf"
version = "0.1.0"
description = "Pipeline médaillon R&D Manufacturing sur Databricks"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",                      # lecture des contrats YAML
    "pyarrow>=15",                    # lecture des livraisons au format Parquet
]

[project.optional-dependencies]
databricks = ["databricks-sdk>=0.166"]                       # l'exécuteur réel (facultatif : le reste du code n'en a pas besoin)
dev = ["pytest>=8", "ruff>=0.5", "databricks-sdk>=0.166"]    # le SDK aussi : les tests de l'exécuteur utilisent ses vrais objets

[tool.pytest.ini_options]
pythonpath = ["src"]                  # `import rd_manuf` fonctionne sans installer le paquet
testpaths = ["tests/unitaires"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
